<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Board Declutter settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Board Declutter</h1>
      <p class="muted">
        Rules run on every GitHub Projects board you open, using only what the board shows on each
        card. Nothing leaves your browser.
      </p>

      <form id="form">
        <section>
          <h2>Mode</h2>
          <label>
            Board mode
            <select name="mode"></select>
            <small id="mode-description"></small>
            <small>
              Picking a mode applies at once and sets the settings below. Changing any of the board
              settings by hand switches back to Normal, keeping what is on the board. Picking Normal
              yourself puts back the values you had before the mode.
            </small>
          </label>
        </section>

        <details open>
          <summary><h2>You and your team</h2></summary>
          <label>
            Run only on these views (one per line)
            <textarea
              name="views"
              rows="2"
              placeholder="https://github.com/orgs/PostHog/projects/112/views/6"
            ></textarea>
            <small>
              Project view URLs; the query string (sort, filters) is ignored. Leave empty to run on
              every board.
            </small>
          </label>
          <label>
            Your GitHub login
            <input name="me" placeholder="octocat" autocomplete="off" />
          </label>
          <label class="check">
            <input name="highlightMine" type="checkbox" /> Highlight cards assigned to you with a
            blue marker
          </label>
          <label>
            Cards not assigned to you
            <select name="notMineMode" data-mode></select>
            <small>Only applies once your GitHub login is set.</small>
          </label>
          <label>
            Team members (one per line)
            <textarea name="teamMembers" rows="4" placeholder="haacked&#10;matheus-vb"></textarea>
          </label>
          <label>
            Team labels (one per line)
            <textarea name="teamLabels" rows="2" placeholder="team/feature-flags"></textarea>
          </label>
          <label>
            Cards from other teams
            <select name="otherTeamsMode" data-mode></select>
            <small>
              Applies to cards assigned to no team member. Unassigned cards count as your team's
              when they carry a team label.
            </small>
          </label>
        </details>

        <details open>
          <summary><h2>Noise</h2></summary>
          <label>
            AI-generated cards
            <select name="aiMode" data-mode></select>
            <small>
              Recognised by label. The view must show the Labels field (View → Fields → Labels) for
              this rule to see them; the toolbar warns when it does not.
            </small>
          </label>
          <label>
            Cards not marked as AI-generated
            <select name="nonAiMode" data-mode></select>
            <small>Set to hide to leave only the bots' cards on the board.</small>
          </label>
          <label>
            Labels that mark a card as AI-generated (one per line)
            <textarea name="aiLabels" rows="2" placeholder="self-driving"></textarea>
          </label>
          <label>
            Cards with no assignee
            <select name="unassignedMode" data-mode></select>
            <small
              >Highlight keeps them visible with an amber marker, to spot work nobody owns.</small
            >
          </label>
          <label>
            Hide titles matching these regexes (one per line)
            <textarea name="titlePatterns" rows="2" placeholder="^trunk-merge/"></textarea>
          </label>
        </details>

        <details open>
          <summary><h2>Layout</h2></summary>
          <label>
            Collapse these columns (one per line)
            <textarea name="collapsedColumns" rows="2" placeholder="Done"></textarea>
            <small>
              Folded into a thin strip so they take no space but stay visible. To remove columns
              entirely, use the Columns section of the floating toolbar's ⚙ panel.
            </small>
          </label>
          <label class="check">
            <input name="compact" type="checkbox" /> Compact cards (single-line titles, no labels or
            other field chips)
          </label>
          <label class="check">
            <input name="preloadColumns" type="checkbox" /> Preload cards (disable lazy-loading)
            <small>
              GitHub fetches a column page by page as you scroll; this scrolls each column for you
              once, so counts and splits cover every card from the start.
            </small>
          </label>
          <label class="check">
            <input name="focus" type="checkbox" /> Full-screen board: hide everything around it
            <small>
              GitHub's header, the project title bar and the view tabs disappear; the filter bar
              stays. Push the mouse against the top edge of the window to bring them back; they hide
              again when the mouse returns to the board.
            </small>
          </label>
          <label class="check">
            <input name="split" type="checkbox" /> Split issues and pull requests into two stacks,
            newest first
            <small>
              Applies to the columns below. Uses GitHub's own "sort by Created"; when "group by
              assignee" is also on, its sort wins and the stacks keep that order.
            </small>
          </label>
          <label>
            Columns to split (one per line)
            <textarea name="splitColumns" rows="2" placeholder="No Status"></textarea>
          </label>
          <label>
            Group cards within each column
            <select name="groupBy">
              <option value="none">Off</option>
              <option value="assignee">By assignee</option>
            </select>
            <small>
              Uses GitHub's own sort through the URL, so the whole column is ordered, and titles the
              first card of each group. Keep "Preload cards" on while grouping: cards not loaded yet
              are not grouped or shown until they load. Turn grouping off to sort the view another
              way.
            </small>
          </label>
        </details>

        <footer>
          <button type="submit">Save</button>
          <button type="button" id="reset" class="secondary">Reset to defaults</button>
          <span id="status" class="muted" role="status"></span>
        </footer>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
