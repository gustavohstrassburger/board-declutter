<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Board Declutter settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Board Declutter</h1>
      <p class="muted">
        Rules run on every GitHub Projects board you open, using only what the board shows on each
        card. Nothing leaves your browser.
      </p>

      <form id="form">
        <section>
          <h2>You and your team</h2>
          <label>
            Your GitHub login
            <input name="me" placeholder="octocat" autocomplete="off" />
            <small>Cards assigned to you get a blue marker and are never hidden.</small>
          </label>
          <label>
            Team members (one per line)
            <textarea name="teamMembers" rows="4" placeholder="haacked&#10;matheus-vb"></textarea>
          </label>
          <label>
            Team labels (one per line)
            <textarea name="teamLabels" rows="2" placeholder="team/feature-flags"></textarea>
          </label>
          <label>
            Cards from other teams
            <select name="otherTeamsMode" data-mode></select>
            <small>Applies to cards with no team member assigned and no team label.</small>
          </label>
        </section>

        <section>
          <h2>Noise</h2>
          <label>
            AI-generated cards
            <select name="aiMode" data-mode></select>
            <small>
              Recognised by label. The view must show the Labels field (View → Fields → Labels) for
              this rule to see them; the toolbar warns when it does not.
            </small>
          </label>
          <label>
            Labels that mark a card as AI-generated (one per line)
            <textarea name="aiLabels" rows="2" placeholder="self-driving"></textarea>
          </label>
          <label>
            Cards with no assignee
            <select name="unassignedMode" data-mode></select>
          </label>
          <label>
            Hide titles matching these regexes (one per line)
            <textarea name="titlePatterns" rows="2" placeholder="^trunk-merge/"></textarea>
          </label>
        </section>

        <section>
          <h2>Layout</h2>
          <label>
            Collapse these columns (one per line)
            <textarea name="collapsedColumns" rows="2" placeholder="Done"></textarea>
            <small>
              Folded into a thin strip so they take no space but stay visible. To remove columns
              entirely, use the Columns button on the board's floating toolbar.
            </small>
          </label>
          <label class="check">
            <input name="compact" type="checkbox" /> Compact cards (single-line titles, no labels)
          </label>
          <label class="check">
            <input name="preloadColumns" type="checkbox" /> Load whole columns when the board opens
            <small>
              GitHub fetches a column page by page as you scroll; this scrolls each column for you
              once, so counts and splits cover every card from the start.
            </small>
          </label>
          <label class="check">
            <input name="focus" type="checkbox" /> Focus mode: hide everything around the board
            <small>
              GitHub's header, the project title bar, the view tabs and the filter bar disappear.
              Push the mouse against the top edge of the window to bring them back; they hide again
              when the mouse returns to the board.
            </small>
          </label>
          <label class="check">
            <input name="split" type="checkbox" /> Split issues and pull requests into two stacks,
            newest first
            <small>
              Applies to the columns below. Uses GitHub's own "sort by Created"; when "group by
              assignee" is also on, its sort wins and the stacks keep that order.
            </small>
          </label>
          <label>
            Columns to split (one per line)
            <textarea name="splitColumns" rows="2" placeholder="No Status"></textarea>
          </label>
          <label class="check">
            <input name="groupByAssignee" type="checkbox" /> Group cards by assignee within each
            column
            <small>
              Uses GitHub's own "sort by Assignees" through the URL, so the whole column is ordered,
              and labels the first card of each group. Turn it off to sort the view another way.
            </small>
          </label>
        </section>

        <footer>
          <button type="submit">Save</button>
          <button type="button" id="reset" class="secondary">Reset to defaults</button>
          <span id="status" class="muted" role="status"></span>
        </footer>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
