name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bin/lint
      - run: bin/test
      - run: bin/build
      # The built extension, ready for chrome://extensions → Load unpacked once unzipped.
      - uses: actions/upload-artifact@v4
        with:
          name: board-declutter-${{ github.sha }}
          path: dist/
          if-no-files-found: error
